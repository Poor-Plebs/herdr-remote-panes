id = "poorplebs.remote-panes"
name = "Remote Panes"
version = "0.4.4"
min_herdr_version = "0.8.0"
description = "Work on other machines from one Herdr: pick a machine, get a terminal on it. Optional two-way mirroring."
platforms = ["linux", "macos"]

# Through sh rather than calling go directly: a machine without Go can then be
# told so, where spawning `go` itself fails with "No such file or directory"
# before anything of ours runs.
[[build]]
command = ["sh", "build.sh"]

# Reconciles remote panes into local mirror panes for the life of the session.
[[startup]]
command = ["./bin/herdr-remote-panes", "daemon"]

[[actions]]
id = "connect"
title = "Remote panes: connect"
description = "Connect to a machine and go to its space. With no machine named, reconnects every one you have configured."
contexts = ["global", "selection"]
command = ["./bin/herdr-remote-panes", "connect"]

[[actions]]
id = "disconnect"
title = "Remote panes: disconnect"
description = "Close a machine's terminals here. The work on the machine keeps running, so connecting again brings it back."
contexts = ["global", "selection"]
command = ["./bin/herdr-remote-panes", "disconnect"]

[[actions]]
id = "open"
title = "Remote panes: new terminal"
description = "New terminal on the machine whose space you are in, and go to it; an ordinary local pane anywhere else."
contexts = ["global", "workspace", "selection"]
command = ["./bin/herdr-remote-panes", "open"]

[[actions]]
id = "menu"
title = "Remote panes: machine menu"
description = "Pick a machine to connect to, from your SSH config and this plugin's own. Also disconnects one, or turns mirroring on and off."
contexts = ["global"]
command = ["./bin/herdr-remote-panes", "menu"]

[[actions]]
id = "open-tab"
title = "Remote panes: new tab"
description = "New tab on the machine whose space you are in, and go to it; an ordinary local tab anywhere else."
contexts = ["global", "workspace", "selection"]
command = ["./bin/herdr-remote-panes", "open-tab"]

[[actions]]
id = "refresh"
title = "Remote panes: refresh"
description = "Reconcile every connected machine right now."
contexts = ["global"]
command = ["./bin/herdr-remote-panes", "refresh"]

[[actions]]
id = "status"
title = "Remote panes: status"
description = "List the machines you are connected to and what each of them has open."
contexts = ["global"]
command = ["./bin/herdr-remote-panes", "status"]

# React to a pane appearing instead of waiting for the next poll. Herdr's own
# new-tab paths open a local shell that has to be moved onto the machine, and
# doing that a couple of seconds later is very visible.
[[events]]
on = "pane.created"
command = ["./bin/herdr-remote-panes", "refresh"]

# The machine menu. A popup is session-modal and gets every key, including
# Escape, which is what a menu needs.
[[panes]]
id = "picker"
title = "Connect to a machine"
description = "Menu of machines to connect to."
placement = "popup"
width = "60%"
height = "60%"
command = ["./bin/herdr-remote-panes", "picker"]

# One mirror pane per remote terminal. The daemon supplies the machine through
# HRP_* environment variables and overrides the placement per machine.
[[panes]]
id = "mirror"
title = "Remote pane"
description = "A terminal on another machine: an SSH session, or a live bridge to a terminal there when mirroring."
placement = "tab"
command = ["./bin/herdr-remote-panes", "mirror"]
