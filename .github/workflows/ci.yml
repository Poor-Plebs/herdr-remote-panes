name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The plugin targets the platforms Herdr's direct terminal attach
        # supports.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod pins the language floor at 1.22; CI builds with a current
          # toolchain. Go 1.22 on current macOS runners fails to link -race
          # test binaries ("missing LC_UUID load command").
          go-version: stable

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Pinned rather than latest: a new release adding a check would fail a
      # commit that has nothing to do with it, on a repository nobody is
      # watching at the time.
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -trimpath -o bin/herdr-remote-panes .
