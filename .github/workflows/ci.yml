name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The plugin targets the platforms Herdr's direct terminal attach
        # supports.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod sets the floor; this matrix deliberately uses a current
          # toolchain, so that what most people build with is what is tested.
          # The floor itself is checked by the job below.
          go-version: stable

      # Each step is a Makefile target, so what runs here and what runs on
      # somebody's machine cannot drift apart -- and "make check" is the whole
      # of it. Kept as separate steps so a failure says which part failed.
      - name: gofmt
        run: make fmt

      - name: Vet
        run: make vet

      - name: Staticcheck
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

  # go.mod advertises Go 1.25, and Herdr builds this plugin from source on the
  # machine it is installed on -- so a call to something added to the standard
  # library since then does not inconvenience someone on that version, it stops
  # them installing it at all. The language version is already held to go.mod by
  # any toolchain; the standard library is not, and that is what this checks.
  #
  # Tested the same way as the matrix rather than more cheaply: a race is a
  # property of a runtime as much as of the code, and this is a different one.
  floor:
    name: oldest supported Go
    runs-on: ubuntu-latest
    env:
      # Fail rather than quietly fetching a newer toolchain, which would make
      # this job agree with everything and check nothing.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build, vet and test on the floor
        run: make vet test build
